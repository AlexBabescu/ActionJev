name: Jev PR review (manual)
run-name: "Jev review of PR #${{ inputs.pr-number }}"

# Do not add pull_request_target, issue_comment or workflow_run triggers here.
# Repository setup (especially environment rules) is documented in SECURITY.md.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open PR number targeting main (forks are supported as data only)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: jev-review-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.repository == 'AlexBabescu/ActionJev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: jev-api
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted workflow code, never the PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: trusted
      - name: Fetch and validate the PR as Git objects only
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: python3 trusted/scripts/prepare-pr-review.py
      - name: Review using a pinned, prebuilt trusted action
        id: jev
        # Packaged v0.1.0 commit, not its mutable major-version tag or PR code.
        uses: AlexBabescu/ActionJev@9ec4a7cd1fc7c879fc566d92ec5c889dfbc57b60
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          token: ${{ github.token }}
          path: ${{ steps.pr.outputs.path }}
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.pr.outputs.head }}
          pr-number: ${{ steps.pr.outputs.pr-number }}
          repository: AlexBabescu/ActionJev
          platform: github
          api-url: https://api.github.com
          typesafe-url: https://api.typesafe.ai/v1/systemone
          comment: 'true'
          fail-on: none
          concurrency: '4'
          max-files: '50'
          max-followups: '24'
      # Intentionally no PR artifacts/caches, shell tools, or PR-supplied policy.
      # The action writes a job summary and updates its PR summary comment.
