name: Jev PR review
run-name: "Jev review of PR #${{ inputs.pr-number }}"

# Do not add pull_request_target, issue_comment or workflow_run triggers here.
# Repository setup (especially environment rules) is documented in SECURITY.md.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open PR number (all base branches and forks are supported as data only)
        type: string
        required: true
      calibrate:
        description: Also check known broken and corrected rounding examples with the real model
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jev-review-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  request:
    outputs:
      approval-required: ${{ steps.request.outputs.approval-required }}
    if: github.repository == 'AlexBabescu/ActionJev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Post approval link on the PR
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: python3 scripts/review_github.py request
  approve:
    needs: request
    if: needs.request.outputs.approval-required != 'false'
    environment: jev-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - run: echo 'External PR review approved.'
  review:
    needs: [request, approve]
    if: >-
      always() && !cancelled() && needs.request.result == 'success' &&
      (needs.approve.result == 'success' ||
       (needs.approve.result == 'skipped' && needs.request.outputs.approval-required == 'false')) &&
      github.repository == 'AlexBabescu/ActionJev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: jev-api
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted workflow code, never the PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: trusted
      - name: Fetch and validate the PR as Git objects only
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: python3 trusted/scripts/prepare-pr-review.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Build the approved main revision without API credentials
        working-directory: trusted
        run: cargo build --release --locked
      - name: Check model quality against broken and corrected examples
        if: inputs.calibrate
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 trusted/scripts/calibrate-review.py trusted/target/release/actionjev trusted/prompts/review.json
      - name: Review using the approved main revision and policy
        id: jev
        uses: ./trusted
        with:
          binary-path: ${{ github.workspace }}/trusted/target/release/actionjev
          policy: ${{ github.workspace }}/trusted/prompts/review.json
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          token: ${{ github.token }}
          path: ${{ steps.pr.outputs.path }}
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.pr.outputs.head }}
          pr-number: ${{ steps.pr.outputs.pr-number }}
          repository: AlexBabescu/ActionJev
          platform: github
          api-url: https://api.github.com
          typesafe-url: https://api.typesafe.ai/v1/systemone
          comment: 'true'
          fail-on: none
          concurrency: '4'
          max-files: '50'
          max-followups: '24'
      # Intentionally no PR artifacts/caches, shell tools, or PR-supplied policy.
      # The action writes a job summary and updates its PR summary comment.
  finish:
    needs: [request, review]
    if: always() && needs.request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Explain any run that left its PR comment pending
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: python3 scripts/review_github.py failure
