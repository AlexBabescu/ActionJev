name: CI
on:
  push:
    branches: [main, feat/rust-jev-action]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Test and package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - name: Install static-linking toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build static Rust binary
        run: cargo build --release --locked --target "$TARGET"
      - name: End-to-end HTTP and Git contracts
        run: python3 tests/e2e.py "target/$TARGET/release/actionjev"
      - name: Installer security and compatibility tests
        run: python3 tests/installer.py
      - name: Bundle binary and checksum
        run: bash scripts/package.sh "$TARGET"
      - name: Default packaged action smoke test
        id: bundled
        uses: ./
        with:
          mode: codebase
          head: HEAD
          comment: 'false'
          dry-run: 'true'
          typesafe-api-key: offline-test-no-api-call
      - name: Explicit source-build smoke test
        id: source
        uses: ./
        with:
          build-from-source: 'true'
          mode: codebase
          head: HEAD
          comment: 'false'
          dry-run: 'true'
          typesafe-api-key: offline-test-no-api-call
      - name: Verify reports and lockfile immutability
        env:
          BUNDLED: ${{ steps.bundled.outputs.report-json }}
          SOURCE: ${{ steps.source.outputs.report-json }}
        run: |
          python3 -c 'import json,os; reports=[json.load(open(os.environ[k])) for k in ("BUNDLED","SOURCE")]; assert all(r["dry_run"] and r["api_calls"] == 0 for r in reports)'
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actionjev-${{ matrix.target }}
          path: dist/
          retention-days: 7
  live:
    name: Live TypeSafe integration (synthetic fixture)
    needs: package
    # Never expose this credential to pull-request-triggered workflows or forks.
    if: >-
      github.repository == 'AlexBabescu/ActionJev' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/rust-jev-action')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: actionjev-x86_64-unknown-linux-musl
          path: dist/
      - name: Create tiny synthetic Git fixture
        id: fixture
        run: python3 scripts/live-smoke.py setup "$RUNNER_TEMP/jev-live-fixture"
      - name: Review fixture with the real API
        id: review
        uses: ./
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          path: ${{ steps.fixture.outputs.path }}
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.head }}
          policy: ${{ steps.fixture.outputs.policy }}
          platform: none
          comment: 'false'
          screen-threshold: '0'
          max-files: '1'
          max-followups: '1'
          concurrency: '1'
          fail-on: none
      - name: Verify live typed responses
        env:
          REPORT: ${{ steps.review.outputs.report-json }}
          TRACE: ${{ steps.review.outputs.trace-jsonl }}
        run: python3 scripts/live-smoke.py verify "$REPORT" "$TRACE"
  publish:
    name: Publish versioned action
    needs: [package, live]
    if: github.repository == 'AlexBabescu/ActionJev' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: actionjev-*-unknown-linux-musl
          merge-multiple: true
          path: dist/
      - name: Publish immutable version and moving major alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh
  consume:
    name: Import the published action
    needs: publish
    if: github.repository == 'AlexBabescu/ActionJev' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: AlexBabescu/ActionJev@v0
        id: imported
        with:
          typesafe-api-key: offline-test-no-api-call
          mode: codebase
          head: HEAD
          dry-run: 'true'
          comment: 'false'
      - name: Verify imported action outputs
        env:
          REPORT: ${{ steps.imported.outputs.report-json }}
        run: python3 -c 'import os,json; r=json.load(open(os.environ["REPORT"])); assert r["dry_run"] and r["api_calls"] == 0'
