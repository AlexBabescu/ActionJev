name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  workflow-security:
    name: Workflow security regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check review trust boundaries
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-checks"
          "$RUNNER_TEMP/workflow-checks/bin/pip" install --disable-pip-version-check 'PyYAML==6.0.3'
          "$RUNNER_TEMP/workflow-checks/bin/python" tests/workflow_security.py
          python3 tests/review_commands.py
  package:
    name: Test and package (${{ matrix.target }})
    needs: workflow-security
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - name: Install static-linking toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build static Rust binary
        run: cargo build --release --locked --target "$TARGET"
      - name: End-to-end HTTP and Git contracts
        run: python3 tests/e2e.py "target/$TARGET/release/actionjev"
      - name: Installer security and compatibility tests
        run: python3 tests/installer.py
      - name: Bundle binary and checksum
        run: bash scripts/package.sh "$TARGET"
      - name: Default packaged action smoke test
        id: bundled
        uses: ./
        with:
          mode: codebase
          head: HEAD
          comment: 'false'
          dry-run: 'true'
          typesafe-api-key: offline-test-no-api-call
      - name: Explicit source-build smoke test
        id: source
        uses: ./
        with:
          build-from-source: 'true'
          mode: codebase
          head: HEAD
          comment: 'false'
          dry-run: 'true'
          typesafe-api-key: offline-test-no-api-call
      - name: Verify reports and lockfile immutability
        env:
          BUNDLED: ${{ steps.bundled.outputs.report-json }}
          SOURCE: ${{ steps.source.outputs.report-json }}
        run: |
          python3 -c 'import json,os; reports=[json.load(open(os.environ[k])) for k in ("BUNDLED","SOURCE")]; assert all(r["dry_run"] and r["api_calls"] == 0 for r in reports)'
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actionjev-${{ matrix.target }}
          path: dist/
          retention-days: 7
