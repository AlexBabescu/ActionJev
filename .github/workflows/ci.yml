name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release binary
        run: cargo build --release --locked
      - name: End-to-end contract tests
        run: python3 tests/e2e.py target/release/actionjev
      - name: Composite preinstalled-binary smoke test
        id: smoke
        uses: ./
        with:
          binary-path: ${{ github.workspace }}/target/release/actionjev
          mode: codebase
          head: HEAD
          comment: 'false'
          dry-run: 'true'
          typesafe-api-key: offline-test-no-api-call
      - name: Composite source-build smoke test
        id: source-smoke
        uses: ./
        with:
          mode: codebase
          head: HEAD
          comment: 'false'
          dry-run: 'true'
          typesafe-api-key: offline-test-no-api-call
      - name: Verify action outputs
        env:
          REPORT: ${{ steps.smoke.outputs.report-json }}
          TRACE: ${{ steps.smoke.outputs.trace-jsonl }}
          SOURCE_REPORT: ${{ steps.source-smoke.outputs.report-json }}
        run: |
          test -f "$REPORT"
          test -f "$TRACE"
          test -f "$SOURCE_REPORT"
          python3 -c 'import json,os; reports=[json.load(open(os.environ[key])) for key in ("REPORT", "SOURCE_REPORT")]; assert all(r["dry_run"] and r["api_calls"] == 0 for r in reports)'
          git diff --exit-code -- Cargo.lock
      - name: Package build evidence
        if: always()
        run: |
          mkdir -p build-evidence
          cp Cargo.lock build-evidence/
          cp target/release/actionjev build-evidence/ 2>/dev/null || true
          cargo fmt
          tar --exclude=.git --exclude=target --exclude=build-evidence -czf build-evidence/source.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actionjev-build-evidence
          path: build-evidence/
          retention-days: 7
