[package]
name = "actionjev"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Bounded, typed Jev code reviews for GitHub and Gitea Actions"
repository = "https://github.com/AlexBabescu/ActionJev"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
httpdate = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
